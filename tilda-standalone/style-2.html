<style>
@media (hover:hover){.hero__cta:hover{background:#f0aa00;border-color:#f0aa00;transform:translateY(-3px);box-shadow:0 12px 26px rgba(255,182,0,.42)}.hero__cta:active{transform:translateY(-1px);box-shadow:0 6px 14px rgba(255,182,0,.34)}}
.inside__grid{grid-template-columns:repeat(6,minmax(0,1fr))}
.inside__grid>.inside-card{grid-column:span 2}

@media (max-width:900px){.inside__grid{grid-template-columns:repeat(2,minmax(0,1fr))}.inside__grid>.inside-card,.inside__grid>.inside-card:nth-child(4),.inside__grid>.inside-card:nth-child(5){grid-column:auto}.inside__grid>.inside-card:nth-child(5){grid-column:1 / -1}}

.reviews__track{display:grid;grid-auto-flow:column;grid-auto-columns:300px;gap:18px;align-items:start;overflow-x:auto;padding:4px 4px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.reviews__track::-webkit-scrollbar{display:none}
.reviews__track:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px}
.reviews__nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--color-primary);color:#fff;border:none;border-radius:var(--radius-pill);box-shadow:var(--shadow-md);cursor:pointer;transition:background .2s,opacity .2s}

.reviews__nav[disabled]{opacity:.3;cursor:default}

</style>
