<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Inter:wght@400;500;600&display=swap&subset=latin,cyrillic" rel="stylesheet" />
<style>
:root{--color-bg:#ffffff;--color-text:#1f1300;--color-muted:#6b6b6b;--color-line:#e5e5e5;--color-primary:#ce2c01;--color-primary-hover:#ffb600;--color-accent-dark:#ca4f00;--color-soft:#f5f5f5;--color-dark:#1f1300;--color-discount:#cf2c02;--radius-sm:10px;--radius-md:16px;--radius-lg:24px;--radius-pill:999px;--shadow-sm:0 2px 8px rgba(31,19,0,0.06);--shadow-md:0 10px 30px rgba(31,19,0,0.10);--font-h:'Unbounded',Arial,sans-serif;--font-b:'Inter',Arial,sans-serif;--container:1200px;--gutter:24px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;word-wrap:break-word;overflow-wrap:break-word}
h1,h2,h3{overflow-wrap:break-word;word-break:keep-all;hyphens:manual;text-wrap:balance}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
ul{list-style:none;padding:0;margin:0}
.container{max-width:var(--container);margin:0 auto;padding:0 var(--gutter)}
h1,h2,h3{font-family:var(--font-h);font-weight:500;margin:0;line-height:1.15}
.section{padding:80px 0}
.section__title{font-size:45px;font-weight:500;text-align:center;margin-bottom:32px}
@media (max-width:768px){.section__title{font-size:30px}}
.section__lead{text-align:center;font-size:18px;color:var(--color-muted);max-width:760px;margin:-12px auto 40px;line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:var(--radius-pill);font-weight:500;font-size:16px;border:2px solid transparent;transition:background .2s,color .2s,border-color .2s,transform .15s;white-space:nowrap;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn--sm{padding:10px 18px;font-size:14px;min-height:40px}
.btn--lg{font-size:16px;padding:18px 36px}
.btn--block{width:100%}
.btn--primary{background:var(--color-primary);color:#fff}
.btn--white{background:#fff;color:var(--color-text);border-color:#fff;font-family:var(--font-b);font-weight:400}

.btn--primary:active,.btn--primary:focus,.btn--white:active,.btn--white:focus{background:var(--color-primary-hover);color:#1f1300;border-color:var(--color-primary-hover)}
.topbar{position:sticky;top:0;z-index:100;background:linear-gradient(90deg,#ce2c01,#ca4f00);color:#fff}

.topbar__text{font-size:14px;font-weight:500}

.topbar__timer{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}

.topbar__unit b{font-family:var(--font-h);font-weight:600;font-size:15px}
.topbar__unit i{font-style:normal;font-size:9px;opacity:.85;margin-top:2px}
.topbar__sep{opacity:.5;font-weight:700}

.overlay-nav__backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .25s;z-index:99}

.rate-card__features li::before{content:"";position:absolute;left:0;top:3px;width:18px;height:18px;background:var(--color-primary) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>') center/10px no-repeat;border-radius:50%}

.rate-card__features-hero::before{content:"⚡" !important;background:transparent !important;border-radius:0 !important;width:auto !important;height:auto !important;font-size:18px;line-height:1;top:0 !important;left:2px !important}

.help__inner{text-align:center;max-width:720px;margin:0 auto}
.help__sub{color:var(--color-muted);margin:0 0 32px;font-size:16px}
.help__buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}

.footer__brand{font-size:45px;font-weight:500;margin-bottom:28px}
@media (max-width:768px){.footer__brand{font-size:30px}.footer__grid{padding:36px 28px 28px;margin:0 12px}}
.footer__phones{margin-bottom:28px;font-size:15px}
.footer__phones a{color:#fff}

.sticky-cta__btn:active{transform:scale(.98)}
